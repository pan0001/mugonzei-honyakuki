<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>运营管理 · 无言势翻译器</title>
  <link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/accounts.js"></script><script defer src="/admin/admin.js"></script>
</head>
<body>
<header><div class="wrap top"><div class="brand"><span class="mark" aria-hidden="true">無</span><span>无言势翻译器</span></div><button type="button" class="light" id="logout" hidden>退出管理</button></div></header>
<main class="wrap">
  <section id="login" class="login card">
    <h1>管理登录</h1><p>输入服务器配置的管理员口令。</p>
    <form id="loginForm" method="post" autocomplete="off">
      <label for="token">管理员口令</label><input id="token" type="password" autocomplete="off" minlength="32" maxlength="256" spellcheck="false" required>
      <button id="signIn" type="submit" disabled>登录后台</button>
    </form>
  </section>
  <p id="notice" class="notice" role="status" aria-live="polite" tabindex="-1">正在检查管理会话…</p>
  <div id="workspace" hidden>
    <h1>运营管理</h1>
    <dl class="overview" aria-label="运营概览"><div><dt>注册账号</dt><dd><button id="openAccounts" class="metric-link" aria-label="查看全部注册账号" type="button"><span id="accounts">—</span> <span aria-hidden="true">→</span></button></dd></div><div><dt>已付订单</dt><dd id="paidOrders">—</dd></div><div><dt>已付金额</dt><dd id="paidAmount">—</dd></div></dl>
    <nav aria-label="管理内容"><button id="accountTab" aria-current="page" aria-controls="accountPage" type="button">账号管理</button><button id="couponTab" aria-controls="couponPage" type="button">优惠活动</button><button id="redemptionTab" aria-controls="redemptionPage" type="button">积分兑换码</button></nav>
    <section id="accountPage" aria-labelledby="accountTab">
      <section class="card" id="accountDirectory">
        <div class="row"><h2 tabindex="-1" id="accountHeading">账号列表</h2><button type="button" id="refreshAccounts" class="light">刷新列表</button></div>
        <form id="accountSearchForm" class="account-search" method="post" autocomplete="off">
          <label for="accountSearch">查找账号<input id="accountSearch" type="search" maxlength="64" placeholder="用户名或完整账号 ID" spellcheck="false" autocapitalize="off"></label>
          <button type="submit">搜索</button><button type="button" id="resetSearch" class="light" hidden>清除</button>
        </form>
        <p id="directoryStatus" class="account-status" role="status" aria-live="polite"></p>
        <div id="accountList"></div><div class="pager" id="accountPager"></div>
      </section>
      <section id="accountDetail" hidden>
        <div class="detail-bar"><button type="button" id="backAccounts" class="light">← 返回账号列表</button><button type="button" id="refreshDetail" class="light">刷新明细</button></div>
        <section class="card"><h2 id="accountName" tabindex="-1">账号明细</h2><p class="account-id" id="accountId"></p>
          <p id="detailStatus" class="account-status" role="status" aria-live="polite"></p><dl class="overview" id="accountMetrics"></dl>
          <div class="actions" id="accountTools" hidden><button type="button" id="adjustCredits">调整积分</button><button type="button" class="light" id="toggleAccount"></button><button type="button" class="light" id="retryAction" hidden>核对上次操作</button></div>
        </section>
        <section class="card"><h2>充值订单</h2><div id="accountOrders" class="records"></div><div class="pager" id="orderPager"></div></section>
        <section class="card"><h2>积分流水</h2><div id="accountLedger" class="records"></div><div class="pager" id="ledgerPager"></div></section>
        <section class="card"><h2>管理操作记录</h2><div id="accountAudit" class="records"></div><div class="pager" id="auditPager"></div></section>
      </section>
    </section>
    <section id="couponPage" aria-labelledby="couponTab" hidden>
      <section class="card"><h2>创建优惠活动</h2>
        <p>先在爱发电建立独立的折扣方案，确保其单月价格与这里的折后价一致。</p>
        <form id="couponForm" method="post" autocomplete="off">
          <div class="grid">
            <label>积分套餐<select id="plan" required></select><small id="planDetail"></small></label>
            <label>折后价（元）<input id="price" type="text" inputmode="decimal" placeholder="例如 8.50" required maxlength="12"></label>
            <label>爱发电折扣方案 ID<input id="providerPlan" required maxlength="32" pattern="[a-fA-F0-9]{32}" spellcheck="false" placeholder="32 位十六进制 ID"></label>
            <label>有效期（天）<input id="couponDays" type="number" min="1" max="365" step="1" value="30" required></label>
            <label>自定义优惠码（选填）<input id="customCode" type="text" maxlength="80" spellcheck="false" autocomplete="off" placeholder="留空则自动生成"><small>用 4–40 个英文字母或数字，可用短横线分隔，请避开 MU 开头。</small></label>
          </div>
          <button id="reviewCoupon" type="submit">核对活动</button>
        </form>
      </section>
      <section class="card"><div class="row"><h2>已有优惠活动</h2><button id="refreshCoupons" type="button" class="light">刷新活动</button></div><div class="records" id="couponList"></div></section>
    </section>
    <section id="redemptionPage" aria-labelledby="redemptionTab" hidden>
      <section class="card"><h2>生成积分兑换码</h2><p>生成后请及时抄存口令。历史列表可查看领取记录。</p>
        <form id="redemptionForm" method="post" autocomplete="off"><div class="grid">
          <label>领取方式<select id="redemptionMode"><option value="singleUse" selected>一次性码 · 仅一人可领</option><option value="oncePerAccount">共享码 · 每个账号可领一次</option></select></label>
          <label>每码积分<input id="credits" type="number" min="1" max="1000000" step="1" required></label>
          <label>生成数量<input id="count" type="number" min="1" max="50" step="1" value="1" required></label>
          <label>有效期（天）<input id="redemptionDays" type="number" min="1" max="365" step="1" value="30" required></label>
          <label>批次备注（选填）<input id="note" maxlength="120" type="text" placeholder="例如 活动名称"></label>
          <label>自定义兑换口令（选填）<input id="redemptionCustomCode" type="text" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="留空则随机生成"><small>仅限生成 1 张。可用 4–40 个汉字、英文字母或数字，可用短横线分组。</small></label>
        </div><button type="submit">核对批次</button></form>
      </section>
      <section class="card"><div class="row"><h2>兑换码记录</h2><button id="refreshRedemptions" type="button" class="light">刷新记录</button></div><div class="records" id="redemptionList"></div></section>
    </section>
    <section class="card issued" id="issued" hidden aria-labelledby="issuedTitle">
      <h2 id="issuedTitle" tabindex="-1"></h2><p>明文仅在这次生成后显示。请先抄存，再关闭。</p>
      <label for="codes">生成的口令</label><textarea id="codes" readonly autocomplete="off" spellcheck="false" rows="4"></textarea>
      <div class="actions"><button id="selectCodes" type="button" class="light">选中全部</button><button id="dismissCodes" type="button">已保存，关闭</button></div>
    </section>
  </div>
</main>
<dialog id="review" aria-labelledby="reviewTitle">
  <h2 id="reviewTitle"></h2><dl id="summary"></dl>
  <p id="reviewMessage" role="status" aria-live="polite"></p>
  <div class="actions"><button type="button" id="confirm">确认</button><button type="button" id="back" class="light">返回</button></div>
</dialog>
<dialog id="actionDialog" aria-labelledby="actionTitle">
  <h2 id="actionTitle"></h2><p id="actionTarget" class="account-id"></p>
  <form id="actionForm" method="post" autocomplete="off">
    <div id="actionFields">
      <div id="adjustFields" class="grid">
        <label>调整方向<select id="adjustDirection"><option value="add">增加积分</option><option value="subtract">扣减积分</option></select></label>
        <label>积分数量<input id="adjustAmount" type="number" min="1" max="1000000" step="1" inputmode="numeric"></label>
      </div>
      <label>操作原因<textarea id="actionReason" rows="2" maxlength="200" placeholder="填写原因，保存到管理操作记录"></textarea></label>
    </div>
    <dl id="actionReview"></dl><p id="actionMessage" role="status" aria-live="polite"></p>
    <div class="actions"><button type="submit" id="actionSubmit">核对操作</button><button type="button" class="light" id="actionClose">取消</button></div>
  </form>
</dialog>
</body></html>
